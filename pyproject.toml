[project]
name = "deily-entries"
version = "0.1.0"
description = "personal diary"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "fastui>=0.9.0",
    "itsdangerous>=2.2.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Добавляем стандартную опцию для отключения вывода предупреждений сторонних библиотек
addopts = ["--disable-warnings"]
